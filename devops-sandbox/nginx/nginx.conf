worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format sandbox '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log sandbox;

    # Docker's embedded DNS resolver — lets us proxy to container names.
    resolver 127.0.0.11 valid=10s ipv6=off;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80 default_server;
        server_name _;

        # Platform root
        location = / {
            default_type text/plain;
            return 200 "DevOps Sandbox Platform — visit /<env_id>/ for a sandbox.\n";
        }

        # Platform's own health probe
        location = /platform/health {
            default_type application/json;
            return 200 "{\"status\":\"ok\",\"service\":\"nginx\"}\n";
        }

        # Per-env routes are dropped into /etc/nginx/conf.d/ by create_env.sh
        # and removed by destroy_env.sh.
        include /etc/nginx/conf.d/*.conf;
    }
}

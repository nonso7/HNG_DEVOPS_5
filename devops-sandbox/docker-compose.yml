# Long-running platform services.
# Sandbox env containers are NOT compose-managed — they're spun up by
# platform/create_env.sh because they're dynamic (one per user request).

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: sandbox-nginx
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - platform
    restart: unless-stopped
    labels:
      sandbox.role: nginx

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sandbox-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - prometheus_data:/prometheus
    # Add host's docker GID so Prometheus can read the Docker socket
    # (needed for docker_sd_configs to discover env containers).
    group_add:
      - "${DOCKER_GID:-999}"
    networks:
      - platform
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    labels:
      sandbox.role: prometheus

  grafana:
    image: grafana/grafana:11.2.2
    container_name: sandbox-grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - platform
    depends_on:
      - prometheus
    restart: unless-stopped
    labels:
      sandbox.role: grafana

networks:
  platform:
    name: ${PLATFORM_NETWORK:-sandbox-platform-net}
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
